version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/servers/harness-mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      uv-servers-harness-mcp:
        applies-to: version-updates
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/opencode"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-opencode:
        applies-to: version-updates
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
